name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter project banao aur files lagao
        run: |
          flutter create --org com.templatestore --project-name template_store --platforms android .
          flutter pub add supabase_flutter image_picker url_launcher qr_flutter
          cp -f main.dart config.dart lib/
          rm -rf test
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Template Store"/' android/app/src/main/AndroidManifest.xml

      - name: APK build
        run: flutter build apk --release

      - name: Release me APK daalo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Template Store v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk

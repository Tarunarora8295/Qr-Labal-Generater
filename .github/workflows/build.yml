name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and add files
        run: |
          flutter create --org com.templatestore --project-name template_store --platforms android .
          flutter pub add supabase_flutter image_picker url_launcher qr_flutter gal http package_info_plus file_picker:^8.1.2 firebase_core firebase_messaging
          # file_picker 8.x is compiled against Android 34 but the other plugins need 36
          for f in $(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*file_picker-*/android/build.gradle' 2>/dev/null); do
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 36/' "$f"
            grep -n "compileSdk" "$f" || true
          done
          cp -f main.dart config.dart lib/
          rm -rf test
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Template Store"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      # A fixed signing key lets a new APK install OVER the old app (no uninstall needed).
      # The key lives in the repo secret SIGNING_BUNDLE. Without it the build still works,
      # but it uses a temporary key and cannot update an installed app.
      - name: Apply fixed signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "::warning::SIGNING_BUNDLE secret is missing - building with a temporary key (app will NOT update in place)"
            exit 0
          fi
          echo "$SIGNING_BUNDLE" | base64 -d | tar xz -C android
          python3 - <<'PY' || echo "::warning::Could not apply the signing key - building with a temporary key"
          import pathlib
          p = pathlib.Path("android/app/build.gradle.kts")
          s = p.read_text()
          load = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
          assert "\nandroid {" in s, "android block not found"
          assert "    buildTypes {" in s, "buildTypes block not found"
          assert 'signingConfig = signingConfigs.getByName("debug")' in s, "debug signing line not found"
          s = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + s
          s = s.replace("\nandroid {", "\n" + load + "android {", 1)
          s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          print("Signing key applied")
          PY

      # Push notifications (Firebase). Needs the repo secret GOOGLE_SERVICES_JSON.
      # Without it the app still builds and works, just without push pop-ups.
      - name: Add Firebase for push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is missing - building WITHOUT push notifications"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          import pathlib, re

          # Google services gradle plugin
          sp = pathlib.Path("android/settings.gradle.kts")
          s = sp.read_text()
          m = re.search(r'^(\s*)id\("com\.android\.application"\)[^\n]*\n', s, re.M)
          assert m, "com.android.application not found in settings.gradle.kts"
          s = s[:m.end()] + m.group(1) + 'id("com.google.gms.google-services") version "4.4.2" apply false\n' + s[m.end():]
          sp.write_text(s)

          bp = pathlib.Path("android/app/build.gradle.kts")
          b = bp.read_text()
          m = re.search(r'^(\s*)id\("com\.android\.application"\)[^\n]*\n', b, re.M)
          assert m, "com.android.application not found in app/build.gradle.kts"
          b = b[:m.end()] + m.group(1) + 'id("com.google.gms.google-services")\n' + b[m.end():]
          bp.write_text(b)

          # high-importance channel so the alert pops up on screen
          f = next(pathlib.Path("android/app/src/main").rglob("MainActivity.kt"))
          pkg = re.search(r'^package\s+(\S+)', f.read_text(), re.M).group(1)
          f.write_text(f"""package {pkg}

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {{
              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      val ch = NotificationChannel("chat", "Chat and order alerts", NotificationManager.IMPORTANCE_HIGH)
                      ch.description = "Support chat, orders and payments"
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }}
              }}
          }}
          """)
          print("Firebase configured")
          PY

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Template Store v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
